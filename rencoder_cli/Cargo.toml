[package]
name = "rencoder_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI frontend for Rencoder."

[[bin]]
name = "rencoder"
path = "src/main.rs"

[dependencies]
rencoder_lib = { path = "../rencoder_lib", features = ["parallel-analyze"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
# The JSONL output escapes the paths -- a Windows path contains
# backslashes, and a hand-written `"{}"` would produce invalid JSON.
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# SIGINT / SIGTERM / SIGHUP (encode.zsh's `trap _cleanup INT TERM HUP`).
signal-hook = "0.3"
# The terminal mode, for reading the quit key (Ctrl-D): in canonical
# mode the line discipline owns Ctrl-D (it is the EOF character).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Console control events (CTRL_C / CTRL_BREAK / CTRL_CLOSE / ...).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(windows)'.dev-dependencies]
# The interrupt e2e sends a console control event to the child
# (design doc §3.11.2) -- the same API the handler uses.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
pretty_assertions = "1"

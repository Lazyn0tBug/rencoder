[package]
name = "rencoder_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dioxus desktop GUI for Rencoder (U21)."
publish = false

[dependencies]
rencoder_lib = { path = "../rencoder_lib" }
dioxus = { version = "0.6", features = ["desktop"] }
dioxus-hooks = "0.6"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "rencoder-ui"
path = "src/main.rs"

# Tell cargo to pick up the assets/ directory so `with_custom_head`
# can find style.css at runtime (Dioxus 0.6 desktop uses wry,
# which serves files relative to the binary's working dir by default
# — declaring it here keeps the path stable).
[package.metadata.dioxus]
asset_dir = "assets"

# Opt into cargo-dist. `publish = false` (U21) makes cargo-dist
# skip this package by default; `dist = true` overrides. The CLI
# is auto-detected (publish = true), the lib has no `[[bin]]`,
# and the UI is the third package needing explicit opt-in.
[package.metadata.dist]
dist = true

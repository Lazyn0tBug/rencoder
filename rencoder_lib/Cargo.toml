[package]
name = "rencoder_lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Rencoder: smart video transcoding and analysis."
# U18: internal lib for this app only. `cargo publish -p rencoder_lib`
# would leak internal types (EncodeConfig, AppConfig schema) and lock
# the schema -- once downstream users depend on these types, breaking
# changes become user-facing. Mark non-publishable to enforce the
# "single application" deployment model.
publish = false

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# v1.2 follow-up #4: lib uses tracing directly. `publish = false`
# (U18, internal lib) means no external consumer pins us to the
# `log` facade; structured fields + #[instrument] are the
# win we wanted. CLI / UI keep their `tracing-log` bridge
# until commit 3 drops it.
tracing = "0.1"
# The logging setup both frontends share: the level vocabulary
# (`LogLevel` -> a subscriber filter) and the rotating file sink
# (§2.3 / §3.10.5). `publish = false` -- internal lib, so the
# subscriber dependency does not leak into a public API surface.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
num_cpus = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
rayon = { version = "1", optional = true }
polars = { version = "0.53", default-features = false, features = ["csv", "lazy", "fmt", "parquet", "json", "dtype-datetime", "temporal"] }
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
# Stopping the encoder's whole process tree on cancel (platform::process):
# the `ffmpeg.exe` on PATH may be a package-manager shim (Chocolatey,
# Scoop) that runs the real ffmpeg as *its* child. Killing the shim
# alone leaves the real encoder running and holding the output open.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# Native FFmpeg probing requires pkg-config + FFmpeg development
# libraries, so it stays opt-in: portable / default builds use the
# ffprobe subprocess instead (see docs/design.md §3.4 "C FFI 桥接层").
default = ["parallel-analyze"]
parallel-analyze = ["dep:rayon"]
c-probe = ["dep:cc", "dep:pkg-config"]

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
pretty_assertions = "1"

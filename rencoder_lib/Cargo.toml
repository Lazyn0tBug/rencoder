[package]
name = "rencoder_lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Rencoder: smart video transcoding and analysis."
# U18: internal lib for this app only. `cargo publish -p rencoder_lib`
# would leak internal types (EncodeConfig, AppConfig schema) and lock
# the schema -- once downstream users depend on these types, breaking
# changes become user-facing. Mark non-publishable to enforce the
# "single application" deployment model.
publish = false

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
thiserror = "1"
num_cpus = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
rayon = { version = "1", optional = true }
polars = { version = "0.53", default-features = false, features = ["csv", "lazy", "fmt", "parquet", "json", "dtype-datetime", "temporal"] }

[features]
default = ["c-probe", "parallel-analyze"]
parallel-analyze = ["dep:rayon"]
c-probe = ["dep:cc", "dep:pkg-config"]

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
pretty_assertions = "1"

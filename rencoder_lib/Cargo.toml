[package]
name = "rencoder_lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Rencoder: smart video transcoding and analysis."
# U18: internal lib for this app only. `cargo publish -p rencoder_lib`
# would leak internal types (EncodeConfig, AppConfig schema) and lock
# the schema -- once downstream users depend on these types, breaking
# changes become user-facing. Mark non-publishable to enforce the
# "single application" deployment model.
publish = false

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# v1.2 follow-up #4: lib uses tracing directly. `publish = false`
# (U18, internal lib) means no external consumer pins us to the
# `log` facade; structured fields + #[instrument] are the
# win we wanted. CLI / UI keep their `tracing-log` bridge
# until commit 3 drops it.
tracing = "0.1"
thiserror = "1"
num_cpus = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
rayon = { version = "1", optional = true }
polars = { version = "0.53", default-features = false, features = ["csv", "lazy", "fmt", "parquet", "json", "dtype-datetime", "temporal"] }
crossbeam-channel = "0.5"

# Windows' `rename` refuses an existing target; the same-volume
# replace (design doc §3.11.2) needs the platform call. Unix uses
# `rename` and needs nothing.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
# Native FFmpeg probing requires pkg-config + FFmpeg development
# libraries, so it stays opt-in: portable / default builds use the
# ffprobe subprocess instead (see docs/design.md §3.4 "C FFI 桥接层").
default = ["parallel-analyze"]
parallel-analyze = ["dep:rayon"]
c-probe = ["dep:cc", "dep:pkg-config"]

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
pretty_assertions = "1"

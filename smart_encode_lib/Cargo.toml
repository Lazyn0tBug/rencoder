[package]
name = "smart_encode_lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Rencoder: smart video transcoding and analysis."

[dependencies]
walkdir = "2"
serde_json = "1"
log = "0.4"
thiserror = "1"
num_cpus = "1"
rayon = { version = "1", optional = true }
polars = { version = "0.46", default-features = false, features = ["csv", "lazy"] }

[features]
default = []
parallel-analyze = ["dep:rayon"]
# c-probe: declared now to silence cfg warnings; deps + ffi module land in Phase 13.
c-probe = []

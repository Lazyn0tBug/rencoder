# GitHub Actions release workflow for Rencoder.
#
# Builds for three targets with cargo-dist:
#   - aarch64-apple-darwin     -> .tar.xz / .tar.gz
#   - x86_64-unknown-linux-gnu -> .tar.xz / .tar.gz
#   - x86_64-pc-windows-msvc   -> .zip (portable)
#
# Each archive is augmented by scripts/dist.sh with the U18 single-dir
# app layout (rencoder.toml + log/ + data/) and gets a checksum that is
# recomputed after the augmentation (cargo-dist hashes the archive
# before it is augmented, so its own checksums describe stale bytes).
#
# A separate `macos-dmg` job turns the aarch64 CLI package into a
# .dmg with macOS' built-in `hdiutil` (cargo-dist 0.32 has no dmg
# installer type).
#
# Triggers on **every** tag push -- the tag is the gate: a branch push
# never reaches this workflow. The release is published for every
# pushed tag, non-SemVer ones included (design doc, "Portable
# distribution and tag releases"). The older
# `v[0-9]*.[0-9]*.[0-9]*` glob was narrower than that: it let
# `nightly-2026-11-23` and `v1.2` through without a release.

name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (must point at the current HEAD)
        required: true
        type: string

# Least privilege: the workflow itself only reads the repo. Writing
# releases is granted to the `release` job alone.
permissions:
  contents: read

# Two releases for the same tag must not run at the same time. We do
# NOT cancel in progress: a half-finished release is worse than a
# queued one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate everything on "the tag we are about to publish really points
  # at this commit". A mistyped dispatch tag would otherwise publish
  # the branch tip under someone else's tag name.
  verify:
    name: verify tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag points at HEAD
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tagged=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          head=$(git rev-parse HEAD)
          if [ "$tagged" != "$head" ]; then
            echo "::error::tag $RELEASE_TAG points at $tagged, HEAD is $head"
            exit 1
          fi
          echo "tag $RELEASE_TAG -> $head"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            # The arm64 macOS image: the aarch64 target is built
            # natively, so cargo-dist never needs a runner to execute
            # it.
            #
            # The label is `macos-15` because that is the **arm64**
            # image (actions/runner-images: "macOS 15 Arm64 --
            # `macos-15`, `macos-15-xlarge`"). The x64 images need an
            # explicit `-intel` / `-large` label.
            #
            # This job used to sit queued forever: `macos-14` is
            # retired and `macos-18` never existed, and a job whose
            # label matches no image waits forever instead of
            # failing. Every macOS job in this repo's history had an
            # empty `runner_name` -- they never ran.
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      # The webview stack, on Linux.
      #
      # `dist build` builds **every** package in the workspace, and
      # one of them is the Dioxus desktop app: on Linux it links
      # webkit2gtk -> gtk3 -> gdk-3.0, so the build fails without
      # these headers ("Package gdk-3.0 was not found"). The list is
      # the same one the CI's `ui` job installs (`.github/workflows/
      # ci.yml`); `libwebkit2gtk-4.0-dev` pulls in `libgtk-3-dev`
      # (and with it `gdk-3.0.pc`).
      #
      # macOS needs nothing (WKWebView is in the system) and Windows
      # needs nothing (WebView2 is preinstalled on the runner).
      - name: Install the webview stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Python is needed for the zip augmentation (scripts/augment_zip.py);
      # `zip` / `unzip` are not reliably available on the windows runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache cargo-dist
        uses: actions/cache@v4
        with:
          # `dist` on unix, `dist.exe` on windows.
          path: |
            ~/.cargo/bin/dist
            ~/.cargo/bin/dist.exe
          # The arch belongs in the key: the dmg job and the build job
          # share an OS-scoped cache.
          key: cargo-dist-v0.32.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-dist
        run: |
          set -euo pipefail
          # The release URL is a 302 to objects.githubusercontent.com:
          # without `-L` curl saves the empty redirect body, `-f` does
          # not fail on a 3xx, and `sh` runs the empty file -- exit 0,
          # no output, nothing installed. That was the "silent no-op",
          # piped or not. `test -s` makes an empty download loud.
          if ! command -v dist >/dev/null 2>&1; then
            installer="$RUNNER_TEMP/cargo-dist-installer.sh"
            curl --proto '=https' --tlsv1.2 -sSfL -o "$installer" \
              https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
            test -s "$installer" || { echo "::error::cargo-dist installer download is empty"; exit 1; }
            sh "$installer"
          fi
          dist --version
      - name: Build and package (cargo-dist + scripts/dist.sh)
        run: |
          set -euo pipefail
          # scripts/dist.sh runs `dist build`, stages the archives into
          # dist/, augments each one with the U18 app-dir layout, and
          # recomputes the checksums.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            bash scripts/dist.sh --target ${{ matrix.target }} --tag=${{ github.event.inputs.tag }}
          else
            bash scripts/dist.sh --target ${{ matrix.target }}
          fi
          ls -la dist/

      - name: Verify the binaries do not link libav*
        shell: bash
        run: |
          set -euo pipefail
          # c-probe is opt-in: the shipped binaries probe through the
          # ffprobe subprocess, so they must NOT depend on a
          # version-matched libavformat / libavcodec / libavutil.
          # Linking them would make the packages break the moment the
          # user's ffmpeg upgrades (macOS bumps the dylib major version
          # regularly; the Linux majors differ per distro release).
          failed=0
          # cargo-dist builds with the `dist` profile, so the binaries
          # are in target/<triple>/dist/ -- NOT target/<triple>/release/
          # (that directory does not exist, so this loop matched
          # nothing and the check passed vacuously).
          for bin in target/${{ matrix.target }}/dist/rencoder*; do
            [ -f "$bin" ] || continue
            if grep -a -q -E "libav(format|codec|util)" "$bin"; then
              echo "::error::$bin links libav* -- c-probe must stay off for release builds"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "no libav* linkage in the release binaries"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.*
            dist/*.zip
            dist/*.sha256
            dist/sha256.sum

  # Build a macOS .dmg from the aarch64 CLI package. cargo-dist 0.32
  # doesn't support dmg natively; `hdiutil` ships with macOS, so no
  # homebrew install is needed.
  macos-dmg:
    name: macos dmg
    needs: [verify, build]
    # `macos-15` is the arm64 image (actions/runner-images); the x64
    # images need an explicit `-intel` / `-large` label.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts-aarch64-apple-darwin
          path: dist-tmp

      - name: Build disk image
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls dist-tmp/rencoder_cli-aarch64-apple-darwin.tar.* | head -1)
          rm -rf dmg-stage
          mkdir -p dmg-stage
          # `tar -xf` auto-detects xz / gzip compression.
          tar -xf "$TARBALL" -C dmg-stage
          APP_DIR=$(find dmg-stage -mindepth 1 -maxdepth 1 -type d | head -1)
          # Ad-hoc signature so the dmg is mountable on Apple Silicon.
          codesign --force --deep --sign - "$APP_DIR/rencoder" 2>&1 | tail -3 || true
          hdiutil create -volname Rencoder -srcfolder dmg-stage -ov \
            -format UDZO rencoder-aarch64-apple-darwin.dmg
          shasum -a 256 rencoder-aarch64-apple-darwin.dmg \
            > rencoder-aarch64-apple-darwin.dmg.sha256

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-dmg
          if-no-files-found: error
          path: |
            *.dmg
            *.dmg.sha256

  # Combine all artifacts into a GitHub Release.
  release:
    name: github release
    needs: [verify, build, macos-dmg]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release/
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la release/

      - name: Verify package checksums
        working-directory: release
        run: |
          set -euo pipefail
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Rencoder ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.*
            release/*.zip
            release/*.dmg
            release/*.sha256

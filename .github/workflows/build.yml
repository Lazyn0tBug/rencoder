name: Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build portable package
        run: bash scripts/dist.sh --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.xz
            dist/*.zip
            dist/*.sha256

  macos-dmg:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifacts-aarch64-apple-darwin
          path: dist-tmp
      - name: Build disk image
        shell: bash
        run: |
          mkdir dmg-stage
          tar -xJf dist-tmp/rencoder_cli-aarch64-apple-darwin.tar.xz -C dmg-stage
          hdiutil create -volname Rencoder -srcfolder dmg-stage -ov -format UDZO rencoder-aarch64-apple-darwin.dmg
          shasum -a 256 rencoder-aarch64-apple-darwin.dmg > rencoder-aarch64-apple-darwin.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-dmg
          if-no-files-found: error
          path: |
            *.dmg
            *.dmg.sha256

  release:
    needs: [build, macos-dmg]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release
          merge-multiple: true
      - name: Verify package checksums
        working-directory: release
        run: |
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Rencoder ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.xz
            release/*.zip
            release/*.dmg
            release/*.sha256

[package]
name = "smart_encode_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI frontend for Rencoder."

[[bin]]
name = "smart-encode"
path = "src/main.rs"

[dependencies]
smart_encode_lib = { path = "../smart_encode_lib", features = ["parallel-analyze"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
ctrlc = "3"
parking_lot = "0.12"
env_logger = "0.10"
log = "0.4"
anyhow = "1"
